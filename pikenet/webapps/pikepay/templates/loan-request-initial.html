<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Computer Loan Agreement</title>

    <style>
      body {
        color: #d6d6d6;
        font-family: Arial, sans-serif;
        background: black;
        display: flex;
        justify-content: center;
        padding: 40px;
      }

      .form-container {
        width: 800px;
        background: #0d0d0d;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      input[type="text"],
      input[type="number"] {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: 1px solid #171717;
        background-color: #171717;
        color: #d6d6d6;
      }

      .row {
        display: flex;
        gap: 10px;
      }

      .row input {
        flex: 1;
      }

      .checkbox-group {
        display: flex;
        gap: 15px;
        margin-top: 10px;
      }

      .checkbox-group label {
        font-weight: normal;
      }

      canvas {
        border: 2px solid #333;
        border-radius: 8px;
        margin-top: 10px;
        width: 100%;
        height: 200px;
        background: white;
        cursor: crosshair;
      }

      .buttons {
        margin-top: 10px;
        display: flex;
        gap: 10px;
      }

      button {
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      .clear {
        background: #b8342f;
        color: white;
      }

      .submit {
        background: #0d7a2b;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <h1>PikePay Personal Loan Request</h1>

      <label>Name of Requester *</label>
      <div class="row">
        <input type="text" placeholder="First" id="firstName" />
        <input type="text" placeholder="Last" id="lastName" />
      </div>

      <label>Loan Ammount *</label>
      <input
        type="number"
        placeholder="The ammount being requested"
        id="loanAmount"
      />

      <label>Loan Justification *</label>
      <input
        type="text"
        placeholder="What you will use the loan for"
        id="loanReason"
        maxlength="254"
      />

      <label>Expected Weekly Income *</label>
      <input
        type="number"
        placeholder="Your expected income the next 7 days"
        id="weeklyIncome"
      />
      <label style="margin-top: 20px">
        <input type="checkbox" id="creditReview" /> I permit administrators of
        PikePay to perform a credit review on my account
      </label>

      <label>Expected check Income *</label>
      <div class="checkbox-group">
        <label><input type="checkbox" /> Headphones</label>
        <label><input type="checkbox" /> Mouse</label>
        <label><input type="checkbox" /> Battery charger</label>
      </div>

     

      <label>Signature *</label>
      <canvas id="signaturePad"></canvas>
 -->
      <div>
        <p style="color: #b8342f; display: none" id="popup-error">
          You must fill out all required areas and accept the user agreement
        </p>
      </div>
      <div class="buttons">
        <button class="clear" onclick="window.location.href = '/pikepay'">
          Cancel Request
        </button>
        <button class="submit" onclick="submitForm()">Submit</button>
      </div>
    </div>

      function clearSignature() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      async function submitForm() {
        const data = {
          first_name: document.getElementById("firstName").value,
          last_name: document.getElementById("lastName").value,
          loan_amount: document.getElementById("loanAmount").value,
          loan_reason: document.getElementById("loanReason").value,
          weekly_income: document.getElementById("weeklyIncome").value,
          credit_review: document.getElementById("creditReview").checked,
        };

        if (
          data["first_name"] == "" ||
          data["last_name"] == "" ||
          data["loan_amount"] == "" ||
          data["loan_reason"] == "" ||
          data["weekly_income"] == "" ||
          data["credit_review"] == false
        ) {
          document.getElementById("popup-error").style.display = "block";
          return;
        }

        try {
          const response = await fetch("/pikepay/submit-initial-request", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          const result = await response.json();

          console.log(result);

          alert("Loan request submitted successfully");
          window.location.href = "/pikepay";
        } catch (error) {
          console.error(error);

          alert("Failed to submit request");
        }
      }
