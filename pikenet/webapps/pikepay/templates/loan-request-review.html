<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Computer Loan Agreement</title>

    <style>
      body {
        color: white;
        font-family: Arial, sans-serif;
        background: black;
        display: flex;
        justify-content: center;
        padding: 40px;
      }

      .form-container {
        width: 800px;
        background: #111111;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: 1px solid black;
        background-color: #333;
        color: White;
      }

      .row {
        display: flex;
        gap: 10px;
      }

      h3 {
        color: #5898ad;
      }

      .checkbox-group {
        display: flex;
        gap: 15px;
        margin-top: 10px;
      }

      .checkbox-group label {
        font-weight: normal;
      }

      canvas {
        border: 2px solid #333;
        border-radius: 8px;
        margin-top: 10px;
        width: 100%;
        height: 200px;
        background: white;
        cursor: crosshair;
      }

      .buttons {
        margin-top: 10px;
        display: flex;
        gap: 10px;
      }

      button {
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      .clear {
        background: #e74c3c;
        color: white;
      }

      .submit {
        background: #2ecc71;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <button class="clear" onclick="window.location.href = '/pikepay'">
        Go Back
      </button>
      <h1>PikePay Personal Loan Request Review</h1>

      <label>Name of Requester</label>
      <h3 id="firstName">{{firstName}}</h3>
      <h3 id="lastName">{{lastName}}</h3>

      <label>Requester Credit Score</label>
      <h3 id="creditScore">{{creditScore}}</h3>

      <label>Loan Ammount</label>
      <h3 id="loanAmount">${{amountRequested}}</h3>

      <label>Loan Justification</label>
      <h3 id="loanReason">{{justification}}</h3>

      <label>Expected Weekly Income</label>
      <h3 id="weeklyIncome">${{expectedIncome}}</h3>

      <label>Repayment Amount *</label>
      <input
        type="number"
        placeholder="Total amount to be repaid"
        id="repaymentAmount"
        onblur="calculateInterest()"
      />

      <label>Loan Length (days) *</label>
      <input
        type="number"
        placeholder="Number of days until full repayment is due"
        id="loanLength"
        onblur="calculateInterest()"
      />

      <label>Payment Cycle (days) *</label>
      <input
        type="number"
        placeholder="Number of days from previous cycle until payment is due"
        id="paymentCycle"
        onblur="calculateInterest()"
      />
      <h3 id="interestRate">next</h3>
      <script>
        function calculateInterest() {
          repaymentAmount = Number(
            document.getElementById("repaymentAmount").value,
          );
          loanLength = Number(document.getElementById("loanLength").value);
          paymentCycle = Number(document.getElementById("paymentCycle").value);
          if (repaymentAmount != "" && loanLength != "" && paymentCycle != "") {
            numberOfPayments = Math.ceil(loanLength / paymentCycle);
            duePerPayment = Math.round(repaymentAmount / numberOfPayments);

            requestedAmount = Number("{{amountRequested}}");
            interestRate =
              (repaymentAmount / requestedAmount) ** (1 / numberOfPayments) - 1;

            document.getElementById("interestRate").innerText =
              (interestRate * 100).toFixed(2) + "%";
          }
        }
      </script>

        <label><input type="checkbox" /> Mouse</label>
        <label><input type="checkbox" /> Battery charger</label>
      </div>

     

      <label>Signature *</label>
      <canvas id="signaturePad"></canvas>
 -->
      <div class="buttons">
        <button class="clear" onclick="clearSignature()">
          Deny Application
        </button>
        <button class="submit" onclick="submitForm()">Approve</button>
      </div>
    </div>

      function clearSignature() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      async function submitForm() {
        const data = {
          first_name: document.getElementById("firstName").value,
          last_name: document.getElementById("lastName").value,
          loan_amount: document.getElementById("loanAmount").value,
          loan_reason: document.getElementById("loanReason").value,
          weekly_income: document.getElementById("weeklyIncome").value,
          credit_review: document.getElementById("creditReview").checked,
        };

        try {
          const response = await fetch("/pikepay/submit-initial-request", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          const result = await response.json();

          console.log(result);

          alert("Loan request submitted successfully");
          window.location.href = "/pikepay";
        } catch (error) {
          console.error(error);

          alert("Failed to submit request");
        }
      }
